<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>POKER TRACKER JAPAN</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b1020;
  color: #ffffff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    sans-serif;
}

.container {
  width: min(1100px, 92%);
  margin: 0 auto;
  padding: 50px 0 80px;
}

header {
  margin-bottom: 40px;
}

.logo {
  font-size: 42px;
  font-weight: 800;
  letter-spacing: -1px;
}

.subtitle {
  color: #a8b1c7;
  font-size: 20px;
  margin-top: 8px;
}

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 50px;
}

.stat {
  background: #171f36;
  border: 1px solid #30405f;
  border-radius: 24px;
  padding: 30px;
}

.stat-label {
  color: #a8b1c7;
  font-size: 20px;
  margin-bottom: 12px;
}

.stat-value {
  font-size: 48px;
  font-weight: 800;
}

.green {
  color: #5ce6ad;
}

.section-title {
  font-size: 30px;
  margin-bottom: 25px;
}

.buttons {
  display: grid;
  gap: 18px;
}

.main-button {
  width: 100%;
  border: none;
  border-radius: 20px;
  padding: 25px;
  font-size: 23px;
  font-weight: 700;
  cursor: pointer;
  background: #1c2945;
  color: white;
}

.main-button.primary {
  background: #5ce6ad;
  color: #071019;
}

.main-button:hover {
  opacity: 0.9;
}

.form-section {
  display: none;
  background: #11192d;
  border: 1px solid #30405f;
  border-radius: 24px;
  padding: 30px;
  margin-top: 30px;
}

.form-section.show {
  display: block;
}

.form-title {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 25px;
}

.form-group {
  margin-bottom: 20px;
}

label {
  display: block;
  color: #c5ccdc;
  font-size: 16px;
  margin-bottom: 8px;
}

input,
select,
textarea {
  width: 100%;
  background: #1a243d;
  color: white;
  border: 1px solid #3a4a6b;
  border-radius: 12px;
  padding: 15px;
  font-size: 17px;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.save-button {
  width: 100%;
  margin-top: 10px;
  padding: 20px;
  border: none;
  border-radius: 15px;
  background: #5ce6ad;
  color: #071019;
  font-size: 20px;
  font-weight: 800;
  cursor: pointer;
}

.save-button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.cancel-button {
  width: 100%;
  margin-top: 12px;
  padding: 16px;
  border: 1px solid #3a4a6b;
  border-radius: 15px;
  background: transparent;
  color: white;
  font-size: 17px;
  cursor: pointer;
}

.message {
  margin-top: 20px;
  padding: 15px;
  border-radius: 12px;
  display: none;
}

.message.success {
  display: block;
  background: #123b2d;
  color: #5ce6ad;
}

.message.error {
  display: block;
  background: #421c24;
  color: #ff8f9e;
}

.loading {
  color: #a8b1c7;
  text-align: center;
  padding: 20px;
}

@media (max-width: 700px) {

  .container {
    padding-top: 30px;
  }

  .logo {
    font-size: 30px;
  }

  .subtitle {
    font-size: 16px;
  }

  .stats {
    grid-template-columns: 1fr;
  }

  .grid2 {
    grid-template-columns: 1fr;
  }

  .stat-value {
    font-size: 40px;
  }

}

</style>

</head>


<body>


<div class="container">


<header>

  <div class="logo">
    ♠ POKER TRACKER JAPAN
  </div>

  <div class="subtitle">
    日本のライブポーカー戦績管理
  </div>

</header>


<section class="stats">


  <div class="stat">

    <div class="stat-label">
      大会数
    </div>

    <div
      class="stat-value"
      id="totalGames"
    >
      0
    </div>

  </div>


  <div class="stat">

    <div class="stat-label">
      ITM率
    </div>

    <div
      class="stat-value"
      id="itmRate"
    >
      0%
    </div>

  </div>


  <div class="stat">

    <div class="stat-label">
      ROI
    </div>

    <div
      class="stat-value green"
      id="roi"
    >
      0%
    </div>

  </div>


  <div class="stat">

    <div class="stat-label">
      累計利益
    </div>

    <div
      class="stat-value"
      id="profit"
    >
      ¥0
    </div>

  </div>


</section>


<h2 class="section-title">
  戦績を記録
</h2>


<div class="buttons">

  <button
    class="main-button primary"
    onclick="showForm()"
  >
    ✏️ 手入力で記録
  </button>

</div>


<div
  id="formSection"
  class="form-section"
>


  <div class="form-title">
    戦績を登録
  </div>


  <!-- 大会区分 -->

  <div class="form-group">

    <label>
      大会区分
    </label>

    <select
      id="type"
      onchange="changeType()"
    >

      <option value="店舗トーナメント">
        店舗トーナメント
      </option>

      <option value="大型大会">
        大型大会
      </option>

    </select>

  </div>


  <!-- 店舗 -->

  <div
    class="form-group"
    id="storeGroup"
  >

    <label>
      店舗
    </label>

    <select id="storeId">

      <option value="">
        店舗を選択してください
      </option>

    </select>

  </div>


  <!-- 大会シリーズ -->

  <div
    class="form-group"
    id="seriesGroup"
    style="display:none;"
  >

    <label>
      大会シリーズ
    </label>

    <select id="seriesId">

      <option value="">
        大会シリーズを選択してください
      </option>

    </select>

  </div>


  <!-- 大会名 -->

  <div class="form-group">

    <label>
      大会名
    </label>

    <input
      id="tournamentName"
      type="text"
      placeholder="例：Daily Tournament / Main Event"
    >

  </div>


  <!-- 開催日 / Buy-in -->

  <div class="grid2">


    <div class="form-group">

      <label>
        開催日
      </label>

      <input
        id="date"
        type="date"
      >

    </div>


    <div class="form-group">

      <label>
        Buy-in（円）
      </label>

      <input
        id="buyIn"
        type="number"
        min="0"
        placeholder="5000"
      >

    </div>


  </div>


  <!-- リエントリー / 参加人数 -->

  <div class="grid2">


    <div class="form-group">

      <label>
        リエントリー回数
      </label>

      <input
        id="reEntry"
        type="number"
        min="0"
        value="0"
      >

    </div>


    <div class="form-group">

      <label>
        参加人数
      </label>

      <input
        id="players"
        type="number"
        min="1"
        placeholder="100"
      >

    </div>


  </div>


  <!-- 順位 / ITM -->

  <div class="grid2">


    <div class="form-group">

      <label>
        順位
      </label>

      <input
        id="rank"
        type="number"
        min="1"
        placeholder="15"
      >

    </div>


    <div class="form-group">

      <label>
        ITM順位（入賞ライン）
      </label>

      <input
        id="itmRank"
        type="number"
        min="1"
        placeholder="15"
      >

    </div>


  </div>


  <!-- 賞金 -->

  <div class="form-group">

    <label>
      賞金（円）
    </label>

    <input
      id="prize"
      type="number"
      min="0"
      value="0"
    >

  </div>


  <!-- メモ -->

  <div class="form-group">

    <label>
      メモ
    </label>

    <textarea
      id="memo"
      placeholder="大会の感想・反省点など"
    ></textarea>

  </div>


  <!-- 保存 -->

  <button
    class="save-button"
    onclick="saveResult()"
  >
    💾 戦績を保存
  </button>


  <!-- キャンセル -->

  <button
    class="cancel-button"
    onclick="hideForm()"
  >
    キャンセル
  </button>


  <!-- メッセージ -->

  <div
    id="message"
    class="message"
  ></div>


</div>


</div>


<script>


// ============================================
// Supabase設定
// ============================================

const SUPABASE_URL =
  "https://whbmhkfvyhrydfmtapzh.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_lo3jCQw7sLLRqFN27aH_5w_IpPJYA3q";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


// ============================================
// 初期化
// ============================================

document.addEventListener(
  "DOMContentLoaded",
  async () => {

    document.getElementById("date").value =
      new Date()
        .toISOString()
        .split("T")[0];


    await loadStores();

    await loadSeries();

    await loadResults();

  }
);


// ============================================
// 店舗一覧取得
// ============================================

async function loadStores() {


  const { data, error } =
    await supabaseClient

      .from("poker_stores")

      .select("id,name,location");


  if (error) {

    console.error(error);

    showMessage(
      "店舗一覧の取得に失敗しました",
      "error"
    );

    return;

  }


  // ========================================
  // 日本語の五十音順に並べ替え
  // ========================================

  data.sort((a, b) => {

    return a.name.localeCompare(
      b.name,
      "ja"
    );

  });


  const select =
    document.getElementById(
      "storeId"
    );


  select.innerHTML =
    '<option value="">店舗を選択してください</option>';


  data.forEach(store => {


    const option =
      document.createElement(
        "option"
      );


    option.value =
      store.id;


    option.textContent =
      store.location

        ? `${store.name}（${store.location}）`

        : store.name;


    select.appendChild(
      option
    );


  });

}


// ============================================
// 大会シリーズ取得
// ============================================

async function loadSeries() {


  const { data, error } =
    await supabaseClient

      .from("tournament_series")

      .select("id,name");


  if (error) {

    console.error(error);

    showMessage(
      "大会シリーズの取得に失敗しました",
      "error"
    );

    return;

  }


  // ========================================
  // 日本語順に並べ替え
  // ========================================

  data.sort((a, b) => {

    return a.name.localeCompare(
      b.name,
      "ja"
    );

  });


  const select =
    document.getElementById(
      "seriesId"
    );


  select.innerHTML =
    '<option value="">大会シリーズを選択してください</option>';


  data.forEach(series => {


    const option =
      document.createElement(
        "option"
      );


    option.value =
      series.id;


    option.textContent =
      series.name;


    select.appendChild(
      option
    );


  });

}


// ============================================
// 大会区分変更
// ============================================

function changeType() {


  const type =
    document.getElementById(
      "type"
    ).value;


  const storeGroup =
    document.getElementById(
      "storeGroup"
    );


  const seriesGroup =
    document.getElementById(
      "seriesGroup"
    );


  if (
    type === "店舗トーナメント"
  ) {


    storeGroup.style.display =
      "block";


    seriesGroup.style.display =
      "none";


  } else {


    storeGroup.style.display =
      "none";


    seriesGroup.style.display =
      "block";

  }

}


// ============================================
// 入力フォーム表示
// ============================================

function showForm() {


  document
    .getElementById(
      "formSection"
    )
    .classList
    .add("show");


  window.scrollTo({

    top:
      document.body.scrollHeight,

    behavior:
      "smooth"

  });

}


// ============================================
// 入力フォーム非表示
// ============================================

function hideForm() {


  document
    .getElementById(
      "formSection"
    )
    .classList
    .remove("show");

}


// ============================================
// 戦績保存
// ============================================

async function saveResult() {


  const type =
    document.getElementById(
      "type"
    ).value;


  const date =
    document.getElementById(
      "date"
    ).value;


  const tournamentName =
    document
      .getElementById(
        "tournamentName"
      )
      .value
      .trim();


  const buyIn =
    Number(
      document.getElementById(
        "buyIn"
      ).value || 0
    );


  const reEntry =
    Number(
      document.getElementById(
        "reEntry"
      ).value || 0
    );


  const players =
    Number(
      document.getElementById(
        "players"
      ).value || 0
    );


  const rank =
    Number(
      document.getElementById(
        "rank"
      ).value || 0
    );


  const itmRank =
    Number(
      document.getElementById(
        "itmRank"
      ).value || 0
    );


  const prize =
    Number(
      document.getElementById(
        "prize"
      ).value || 0
    );


  const memo =
    document
      .getElementById(
        "memo"
      )
      .value
      .trim();


  const storeId =
    document.getElementById(
      "storeId"
    ).value || null;


  const seriesId =
    document.getElementById(
      "seriesId"
    ).value || null;


  // ========================================
  // 入力チェック
  // ========================================

  if (!date) {

    showMessage(
      "開催日を入力してください",
      "error"
    );

    return;

  }


  if (!tournamentName) {

    showMessage(
      "大会名を入力してください",
      "error"
    );

    return;

  }


  if (buyIn <= 0) {

    showMessage(
      "Buy-inを入力してください",
      "error"
    );

    return;

  }


  if (players <= 0) {

    showMessage(
      "参加人数を入力してください",
      "error"
    );

    return;

  }


  if (rank <= 0) {

    showMessage(
      "順位を入力してください",
      "error"
    );

    return;

  }


  if (
    type === "店舗トーナメント"
    &&
    !storeId
  ) {

    showMessage(
      "店舗を選択してください",
      "error"
    );

    return;

  }


  if (
    type === "大型大会"
    &&
    !seriesId
  ) {

    showMessage(
      "大会シリーズを選択してください",
      "error"
    );

    return;

  }


  // ========================================
  // 保存中
  // ========================================

  const saveButton =
    document.querySelector(
      ".save-button"
    );


  saveButton.disabled =
    true;


  saveButton.textContent =
    "保存中...";


  // ========================================
  // Supabaseへ保存
  // ========================================

  const { error } =
    await supabaseClient

      .from("poker_results")

      .insert({

        date:
          date,

        type:
          type,

        series_id:
          seriesId,

        store_id:
          storeId,

        tournament_name:
          tournamentName,

        buy_in:
          buyIn,

        re_entry:
          reEntry,

        players:
          players,

        rank:
          rank,

        itm_rank:
          itmRank,

        prize:
          prize,

        memo:
          memo || null

      });


  // ========================================
  // 保存完了
  // ========================================

  saveButton.disabled =
    false;


  saveButton.textContent =
    "💾 戦績を保存";


  if (error) {


    console.error(error);


    showMessage(
      "保存に失敗しました：" +
      error.message,
      "error"
    );


    return;

  }


  showMessage(
    "🎉 戦績を保存しました！",
    "success"
  );


  await loadResults();


  setTimeout(() => {


    hideForm();


    document
      .getElementById(
        "formSection"
      )
      .scrollIntoView({

        behavior:
          "smooth"

      });


  }, 1000);

}


// ============================================
// 戦績取得・集計
// ============================================

async function loadResults() {


  const { data, error } =
    await supabaseClient

      .from("poker_results")

      .select("*")

      .order(
        "date",
        {
          ascending:
            false
        }
      );


  if (error) {

    console.error(error);

    return;

  }


  const results =
    data || [];


  const totalGames =
    results.length;


  let itmGames =
    0;


  let totalCost =
    0;


  let totalPrize =
    0;


  results.forEach(
    result => {


      const buyIn =
        Number(
          result.buy_in || 0
        );


      const reEntry =
        Number(
          result.re_entry || 0
        );


      const prize =
        Number(
          result.prize || 0
        );


      const rank =
        Number(
          result.rank || 0
        );


      const itmRank =
        Number(
          result.itm_rank || 0
        );


      // ====================================
      // 総投資額
      // ====================================

      const cost =
        buyIn *
        (1 + reEntry);


      totalCost +=
        cost;


      totalPrize +=
        prize;


      // ====================================
      // ITM判定
      // ====================================

      if (

        itmRank > 0
        &&
        rank > 0
        &&
        rank <= itmRank

      ) {

        itmGames++;

      }


    }
  );


  // ========================================
  // ITM率
  // ========================================

  const itmRate =

    totalGames > 0

      ? (
          itmGames /
          totalGames
        ) * 100

      : 0;


  // ========================================
  // 利益
  // ========================================

  const profit =
    totalPrize -
    totalCost;


  // ========================================
  // ROI
  // ========================================

  const roi =

    totalCost > 0

      ? (
          profit /
          totalCost
        ) * 100

      : 0;


  // ========================================
  // 画面更新
  // ========================================

  document
    .getElementById(
      "totalGames"
    )
    .textContent =
      totalGames;


  document
    .getElementById(
      "itmRate"
    )
    .textContent =
      itmRate.toFixed(1) +
      "%";


  document
    .getElementById(
      "roi"
    )
    .textContent =
      roi.toFixed(1) +
      "%";


  document
    .getElementById(
      "profit"
    )
    .textContent =
      "¥" +
      profit.toLocaleString();

}


// ============================================
// メッセージ
// ============================================

function showMessage(
  text,
  type
) {


  const message =
    document.getElementById(
      "message"
    );


  message.textContent =
    text;


  message.className =
    "message " +
    type;

}


// ============================================

</script>


</body>

</html>
